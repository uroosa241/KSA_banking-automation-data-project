
name: KSA Banking Pipeline CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall -q scripts dags tests

      - name: Generate synthetic banking data
        run: |
          python -m scripts.generate_customers
          python -m scripts.generate_accounts
          python -m scripts.generate_transactions

      - name: Verify generated CSV files
        run: |
          test -f data/raw/customers.csv
          test -f data/raw/accounts.csv
          test -f data/raw/transactions.csv

      - name: Run tests
        run: |
          pytest -v
